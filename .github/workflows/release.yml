name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Prefer a PAT (RELEASE_TOKEN) so the bot push to main can bypass
          # branch protection. Fall back to GITHUB_TOKEN — if branch protection
          # blocks the push later, the workflow logs it and still creates the
          # GitHub Release. The maintainer can then push the Formula commit
          # manually using the SHA256 included in release notes.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Download release tarball and calculate SHA256
        id: sha
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz"
          echo "Downloading $url"
          curl -sL "$url" -o release.tar.gz
          sha=$(shasum -a 256 release.tar.gz | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA256: $sha"

      - name: Update Formula, CLI, marketplace
        run: |
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha.outputs.sha256 }}\"|" Formula/north-starr-genai.rb
          sed -i "s|url \".*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz\"|" Formula/north-starr-genai.rb
          sed -i "s/^VERSION=\".*\"/VERSION=\"${{ steps.version.outputs.version_no_v }}\"/" bin/north-starr-genai
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.version_no_v }}\"/g" .claude-plugin/marketplace.json

      - name: Commit and push (best-effort)
        id: push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/north-starr-genai.rb bin/north-starr-genai .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "No changes to commit (likely the maintainer already pushed the release commit)."
            echo "pushed=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Release ${{ steps.version.outputs.version }}: update formula sha256 and versions"
          if git push origin main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Push to main failed (branch protection or token issue). Maintainer must push manually using the SHA256 in release notes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Release artifacts

            - **Tarball SHA256:** `${{ steps.sha.outputs.sha256 }}`
            - **Tarball URL:** https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz
            - **Formula auto-update:** ${{ steps.push.outputs.pushed }}

            If `Formula auto-update` is `false` or `skipped`, the maintainer must apply the Formula sha256 + URL update manually:

            ```bash
            # In Formula/north-starr-genai.rb:
            #   url "https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz"
            #   sha256 "${{ steps.sha.outputs.sha256 }}"
            ```
